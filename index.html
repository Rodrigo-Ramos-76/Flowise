<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;color:#1f2937;font-size:14px}
.hdr{background:#fff;padding:16px 20px;border-bottom:1px solid #e5e7eb}
.hdr h1{font-size:1.2rem;font-weight:900}
.hdr p{font-size:.75rem;color:#6b7280;margin-top:2px}
.tabs{background:#fff;display:flex;overflow-x:auto;border-bottom:2px solid #e5e7eb;position:sticky;top:0;z-index:20}
.tab{padding:10px 15px;cursor:pointer;font-size:.8rem;color:#6b7280;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.15s}
.tab:hover{color:#4f46e5}
.tab.on{color:#4f46e5;font-weight:700;border-bottom-color:#4f46e5}
.wrap{padding:14px 14px 40px;max-width:1400px;margin:0 auto}
.pg{display:none}.pg.on{display:block}

/* layout */
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cols2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:900px){.cols3,.cols2{grid-template-columns:1fr}}
.card{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.07);padding:14px;margin-bottom:12px}
.card-h{font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card-h .cor{width:4px;height:18px;border-radius:2px;flex-shrink:0}

/* school header strip */
.sch-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #f3f4f6}
.sch-name{font-size:1rem;font-weight:800}
.sch-tag{font-size:.68rem;padding:2px 7px;border-radius:4px;background:#fef9c3;color:#854d0e;font-weight:600;margin-left:4px}
.sch-desc{font-size:.76rem;color:#4b5563;line-height:1.6;margin-bottom:10px;background:#f9fafb;border-radius:7px;padding:10px}

/* select */
.fld{margin-bottom:10px}
.fld label{font-size:.74rem;color:#6b7280;font-weight:600;display:block;margin-bottom:4px}
.fld select{width:100%;border:1px solid #d1d5db;border-radius:7px;padding:6px 8px;font-size:.78rem;background:#fff}

/* hours table */
.hrs-tbl{width:100%;border-collapse:collapse;font-size:.76rem;margin-bottom:8px}
.hrs-tbl th{padding:5px 8px;background:#f3f4f6;text-align:left;font-size:.72rem;color:#6b7280;font-weight:600;border-bottom:1px solid #e5e7eb}
.hrs-tbl td{padding:5px 8px;border-bottom:1px solid #f9fafb}
.hrs-tbl .sub{color:#9ca3af;font-size:.7rem}
.turno-bar{display:flex;border-radius:6px;overflow:hidden;height:20px;margin:6px 0}
.t-seg{background:#c7d2fe;display:flex;align-items:center;justify-content:center;font-size:.65rem;color:#3730a3;font-weight:600}
.t-cont{background:#bbf7d0;display:flex;align-items:center;justify-content:center;font-size:.65rem;color:#14532d;font-weight:600}
.t-livre{background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:.65rem;color:#9ca3af}
.leg{display:flex;gap:10px;font-size:.68rem;color:#6b7280;margin-bottom:6px}
.leg span{display:flex;align-items:center;gap:4px}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* discounts */
.disc-card{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.07);padding:14px;margin-bottom:12px}
.disc-school-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #f3f4f6}
.disc-ref{font-size:.72rem;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:7px;padding:8px 10px;margin-bottom:10px;color:#14532d}
.disc-ref-item{margin-bottom:3px}
.disc-warn{font-size:.72rem;background:#fefce8;border:1px solid #fde68a;border-radius:7px;padding:8px 10px;margin-bottom:10px;color:#854d0e}
.pct-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.pct-btn{padding:4px 10px;border-radius:6px;border:1px solid #d1d5db;font-size:.76rem;cursor:pointer;background:#f9fafb;transition:.15s;font-weight:500}
.pct-btn:hover{background:#eef2ff;border-color:#a5b4fc}
.pct-btn.on{background:#4f46e5;color:#fff;border-color:#4f46e5;font-weight:700}
.pct-custom{border:1px solid #d1d5db;border-radius:6px;padding:4px 8px;font-size:.76rem;width:70px;background:#fff}
.price-flow{display:flex;align-items:center;gap:6px;font-size:.78rem;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid #f3f4f6}
.price-bruto{color:#9ca3af;text-decoration:line-through}
.price-arrow{color:#9ca3af}
.price-final{font-size:1rem;font-weight:900}
.price-eco{font-size:.72rem;color:#059669;background:#dcfce7;padding:2px 7px;border-radius:4px;font-weight:600}
.disc-section{margin-bottom:10px}
.disc-section-title{font-size:.72rem;font-weight:700;color:#6b7280;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}

.eq-global{background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;padding:14px;margin-bottom:14px}
.eq-title{font-weight:700;color:#3730a3;margin-bottom:10px;font-size:.88rem}
.eq-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}

.eq-item{background:#fff;border-radius:8px;padding:10px;text-align:center;cursor:pointer;border:2px solid #e0e7ff;transition:.15s}
.eq-item.on{border-color:#4f46e5;background:#f5f3ff}
.eq-item .icon{font-size:1.2rem}

.atv-tbl td{padding:5px 8px;border-bottom:1px solid #f9fafb;vertical-align:middle}
.atv-tbl tr:last-child td{border-bottom:none}
.atv-btns{display:flex;gap:3px;flex-wrap:wrap}
.atv-btn{padding:2px 7px;border-radius:4px;border:1px solid #d1d5db;font-size:.68rem;cursor:pointer;background:#f9fafb;white-space:nowrap;transition:.15s}

.r1{background:#ffd700;color:#78350f}
.r2{background:#c6efce;color:#14532d}
.r3{background:#fee2e2;color:#991b1b}
.sum-card{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.07);padding:14px;border-left:4px solid}
.sum-total{font-size:1.35rem;font-weight:900;margin:5px 0 2px}

/* compare table */
.cmp{width:100%;border-collapse:collapse;font-size:.79rem}
.cmp th{padding:8px 10px;border-bottom:2px solid #e5e7eb;font-weight:600;font-size:.75rem;text-align:center}
.cmp th.lft{text-align:left}

.cmp td.lft{text-align:left;color:#6b7280}

.cmp .rbold td{font-weight:700;background:#eef2ff}
.cmp .rproj td{font-weight:700;background:#fefce8}
.bv{color:#059669;font-weight:700}
.bl{font-size:.63rem;color:#059669;display:block}

/* misc */
.info{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:9px 12px;font-size:.75rem;color:#1e40af;margin-bottom:12px}
.warn{background:#fefce8;border:1px solid #fde68a;border-radius:8px;padding:9px 12px;font-size:.75rem;color:#854d0e;margin-bottom:12px}
.danger{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.07);padding:12px 16px;border-left:4px solid #ef4444;margin-top:14px}
.tot-footer{display:flex;justify-content:space-between;align-items:center;padding-top:8px;margin-top:8px;border-top:1px solid #f3f4f6}
.badge-inc{font-size:.68rem;padding:1px 6px;border-radius:4px;background:#dcfce7;color:#15803d;font-weight:600}
.badge-ext{font-size:.68rem;padding:1px 6px;border-radius:4px;background:#dbeafe;color:#1d4ed8;font-weight:600}

    enem:'Rede global canadense', ingles:'Bilíngue canadense ✓', dist:'~10–15 min',
    pros:['Bilíngue canadense integrado ao currículo','Melhor combinação de descontos (11%+10% cumulativos)','Reajuste ~9%/ano — mais previsível','Sem taxa de matrícula'],

    mods:[
      { id:'mm', label:'Só Manhã — turno regular', bruto:5989.10, reaj:0.09, tag:'Regular',

        disc_warn:null,
        pad:{nat:{s:'ext',c:715},fut:{s:'ext',c:280},rb:{s:'inc',c:0,n:'Bilíngue canadense incluso'},alim:{s:'nao',c:0,n:'Cantina livre no intervalo'},mat:{s:'ext',c:339,n:'SLM+ R$4.065/ano ÷12'}} },
      { id:'mba', label:'Manhã + B&A (Before & After)', bruto:8838.10, reaj:0.09, tag:'Integral',
        turno:{e:'7h30',s:'12h50',h:5.33,d:5}, contraturno:{e:'12h50',s:'17h30',h:4.67,d:5,n:'B&A — Before & After'},
        disc_ref:['10% irmandade — confirmado','+ 5% pontualidade (1º dia útil)','+ 7% semestral sobre bruto','+ 11% anual sobre bruto (cumul. c/ 10%) ⭐'],
        disc_warn:null,
        pad:{nat:{s:'ext',c:715},fut:{s:'ext',c:280},rb:{s:'inc',c:0,n:'Bilíngue canadense incluso'},alim:{s:'inc',c:0,n:'Almoço+lanche inclusos (~R$600/mês)'},mat:{s:'ext',c:339,n:'SLM+ R$4.065/ano ÷12'}} },

  pentagono: {

        turno:{e:'7h30',s:'12h30',h:5.0,d:5}, contraturno:{e:'12h30',s:'15h30',h:3.0,d:3,n:'Semi Integral (3 dias/sem)'},
        disc_ref:['Sem desconto Gênesis 2 nessa modalidade','+ 2,5% semestral sobre líquido','+ 5% anual sobre líquido'],
        disc_warn:'Desconto 15% Gênesis 2 não se aplica a esta modalidade.',
        pad:{nat:{s:'ext',c:715},fut:{s:'ext',c:280},rb:{s:'inc',c:0,n:'Learn&Play+Cambridge incluso'},alim:{s:'ext',c:520,n:'R$31,20/dia ~R$520/mês'},mat:{s:'nao',c:0}} },
      { id:'p5', label:'Semi Integral 5x/sem', bruto:6972.15, reaj:0.087, tag:'🏊 Nat. inclusa',
        turno:{e:'7h30',s:'12h30',h:5.0,d:5}, contraturno:{e:'12h30',s:'15h30',h:3.0,d:5,n:'Semi Integral (5 dias/sem)'},

        disc_warn:'Natação inclusa nesta modalidade — economia de R$715/mês.',

};

var ATVS=[
  {k:'nat',  l:'🏊 Natação',    icon:'🏊'},
  {k:'fut',  l:'⚽ Futsal',     icon:'⚽'},
  {k:'rb',   l:'🔵 Red Balloon',icon:'🔵'},
  {k:'alim', l:'🍽️ Alimentação',icon:'🍽️'},
  {k:'mat',  l:'📚 Material',   icon:'📚'},
];
var EIDS=['anglo','maple','pentagono'];
var PCTS=[0,5,10,15,20,25,30,35];

// ════════════════════════════════════════════
//  ESTADO
// ════════════════════════════════════════════
function discPadraoD1(eid,midx){
  // Desconto principal padrão por escola/modalidade
  if(eid==='pentagono') return midx===0?15:0; // 15% só no Regular
  if(eid==='maple') return 10;
  if(eid==='anglo') return midx===0?25:35;
  return 0;
}

var ST={};
EIDS.forEach(function(eid){
  var d=DEF[eid], m=d.mods[0];
  ST[eid]={
    ativa:true, midx:0,
    disc1:discPadraoD1(eid,0),
    disc2:0,
    custom1:false, custom2:false,
    atv: JSON.parse(JSON.stringify(m.pad))
  };
});

// equalização global
var EQ={nat:true,fut:true,rb:true,alim:true,mat:true};

// ════════════════════════════════════════════
//  CÁLCULOS
// ════════════════════════════════════════════
function getMod(eid){return DEF[eid].mods[ST[eid].midx];}

function calcEscola(eid){
  var e=ST[eid], m=getMod(eid);
  var d=(e.disc1+e.disc2)/100;
  if(d>0.99)d=0.99;
  return m.bruto*(1-d);
}

function calcExtras(eid){
  var tot=0;
  ATVS.forEach(function(a){
    var cfg=ST[eid].atv[a.k];
    if(cfg.s==='ext') tot+=Number(cfg.c||0);
  });
  return tot;
}

function calcTotal(eid){
  var e=calcEscola(eid), x=calcExtras(eid);
  return {e:e, x:x, t:e+x};
}

function calcProj(eid){
  var m=getMod(eid), base=calcTotal(eid).t, tot=0, anos=[];
  for(var i=0;i<5;i++){var v=base*Math.pow(1+m.reaj,i);tot+=v*13;anos.push(v);}
  return {anos:anos,tot:tot};
}

function R(v){return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function Rp(v){return Number(v).toFixed(1)+'%';}

          '<div style="font-size:.7rem;color:#6b7280">'+
            (ST[item.eid].disc1+ST[item.eid].disc2>0?'Desconto: '+(ST[item.eid].disc1+ST[item.eid].disc2)+'%':'')+

      '<div style="font-size:.75rem;color:#6b7280;margin-top:8px;line-height:1.8">'+

        '<br><strong>Projeção 5 anos: '+R(proj.tot)+'</strong>'+

      (bd.t===minT?'<div style="font-size:.7rem;color:#059669;margin-top:4px">🏆 Menor mensalidade</div>':'')+
      (proj.tot===minP?'<div style="font-size:.7rem;color:#059669">📈 Menor custo 5 anos</div>':'')+
    '</div>';
  }).join('')+'</div>';

  var top=bds[0], projTop=ativas.find(function(eid){return calcProj(eid).tot===minP;});
  var diff=bds.length>1?bds[1].bd.t-bds[0].bd.t:0;
  var analise='<div style="background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;padding:14px">'+
    '<strong style="color:#3730a3">🤖 Análise</strong><br><br>'+

// ════════════════════════════════════════════
//  RENDER COMPARAR
// ════════════════════════════════════════════
function renderComparar(){
  var ativas=EIDS.filter(function(eid){return ST[eid].ativa;});
  if(!ativas.length){document.getElementById('p-comparar').innerHTML='<p style="color:#9ca3af;text-align:center;padding:40px">Ative escolas na aba Escolas</p>';return;}

  var bds=ativas.map(function(eid){return calcTotal(eid);});
  var projs=ativas.map(function(eid){return calcProj(eid);});
  var minT=Math.min.apply(null,bds.map(function(b){return b.t;}));
  var minP=Math.min.apply(null,projs.map(function(p){return p.tot;}));

  var th='<th class="lft">Item</th>'+ativas.map(function(eid){
    var d=DEF[eid],m=getMod(eid);
    return '<th style="color:'+d.cor+'">'+d.nome+'<br><span style="font-weight:400;font-size:.7rem;color:#6b7280">'+m.label.split(' — ')[0]+'</span><br><span style="font-size:.68rem;color:#6b7280">Desc: '+(ST[eid].disc1+ST[eid].disc2)+'%</span></th>';
  }).join('');

  var tbody='';
  // atividades rows
  ATVS.forEach(function(a){
    if(!EQ[a.k])return;
    var cells=ativas.map(function(eid){
      var cfg=ST[eid].atv[a.k];
      if(cfg.s==='inc') return '<td style="color:#16a34a;font-size:.74rem">✅ Incluso</td>';
      if(cfg.s==='nao') return '<td style="color:#9ca3af;font-size:.74rem">—</td>';
      return '<td>'+R(cfg.c)+'</td>';
    }).join('');
    tbody+='<tr><td class="lft">'+a.l+'</td>'+cells+'</tr>';
  });

  // subtotais
  tbody+='<tr><td class="lft" style="color:#9ca3af;font-size:.73rem">Mensalidade escola</td>'+ativas.map(function(eid){return '<td>'+R(calcEscola(eid))+'</td>';}).join('')+'</tr>';
  tbody+='<tr><td class="lft" style="color:#9ca3af;font-size:.73rem">Total extras</td>'+bds.map(function(b){return '<td>'+R(b.x)+'</td>';}).join('')+'</tr>';
  tbody+='<tr class="rbold"><td class="lft">TOTAL MENSAL</td>'+bds.map(function(b){return '<td class="'+(b.t===minT?'bv':'')+'">'+(b.t===minT?'🏆 ':'')+R(b.t)+(b.t===minT?'<span class="bl">menor</span>':'')+'</td>';}).join('')+'</tr>';
  tbody+='<tr class="rproj"><td class="lft">Total 5 anos</td>'+projs.map(function(p){return '<td class="'+(p.tot===minP?'bv':'')+'">'+(p.tot===minP?'🏆 ':'')+R(p.tot)+(p.tot===minP?'<span class="bl">menor</span>':'')+'</td>';}).join('')+'</tr>';

  var infoR=[
    {l:'Reajuste/ano',fn:function(eid){return Rp(getMod(eid).reaj*100);}},
    {l:'Turno',fn:function(eid){var m=getMod(eid);return m.turno.e+'–'+m.turno.s+' ('+m.turno.h.toFixed(1)+'h)';}},
    {l:'Contra-turno',fn:function(eid){var c=getMod(eid).contraturno;return c?c.e+'–'+c.s+' ('+c.h+'h, '+c.d+'x/sem)':'—';}},
    {l:'Horas/dia',fn:function(eid){var m=getMod(eid);return (m.turno.h+(m.contraturno?m.contraturno.h:0)).toFixed(1)+'h';}},
    {l:'Inglês',fn:function(eid){return DEF[eid].ingles;}},
    {l:'Distância',fn:function(eid){return DEF[eid].dist;}},
    {l:'Ranking ENEM',fn:function(eid){return DEF[eid].enem;}},
  ];
  tbody+=infoR.map(function(r){return '<tr><td class="lft" style="color:#9ca3af;font-size:.73rem">'+r.l+'</td>'+ativas.map(function(eid){return '<td style="color:#6b7280;font-size:.73rem">'+r.fn(eid)+'</td>';}).join('')+'</tr>';}).join('');

  document.getElementById('p-comparar').innerHTML='<div style="overflow-x:auto"><table class="cmp"><thead><tr>'+th+'</tr></thead><tbody>'+tbody+'</tbody></table></div>';
}

// ════════════════════════════════════════════

// ════════════════════════════════════════════
function renderProjecao(){
  var ativas=EIDS.filter(function(eid){return ST[eid].ativa;});
  if(!ativas.length){document.getElementById('p-projecao').innerHTML='<p style="color:#9ca3af;text-align:center;padding:40px">Ative escolas na aba Escolas</p>';return;}

  var anos=[2027,2028,2029,2030,2031];
  var projs=ativas.map(function(eid){return {eid:eid,p:calcProj(eid)};});
  var minP=Math.min.apply(null,projs.map(function(x){return x.p.tot;}));

  var th='<th class="lft">Ano</th>'+ativas.map(function(eid){
    var d=DEF[eid];
    return '<th style="color:'+d.cor+'">'+d.nome+'<br><span style="font-weight:400;font-size:.7rem">'+(getMod(eid).reaj*100).toFixed(1)+'%/ano</span></th>';
  }).join('');

  var tbody=anos.map(function(ano,i){
    var vals=projs.map(function(x){return x.p.anos[i];});
    var minV=Math.min.apply(null,vals);
    return '<tr><td class="lft"><strong>'+ano+'</strong></td>'+vals.map(function(v){return '<td class="'+(v===minV?'bv':'')+'">'+R(v)+(v===minV?' 🏆':'')+'</td>';}).join('')+'</tr>';
  }).join('');
  tbody+='<tr class="rproj"><td class="lft">TOTAL 5 ANOS</td>'+projs.map(function(x){return '<td class="'+(x.p.tot===minP?'bv':'')+'">'+R(x.p.tot)+(x.p.tot===minP?'<span class="bl">🏆 menor</span>':'')+'</td>';}).join('')+'</tr>';

  document.getElementById('p-projecao').innerHTML=
    '<div class="warn">Reajuste histórico por escola: Anglo 12,5%/ano · Maple 9%/ano · Pentágono 8,7%/ano. Aplicado sobre o total mensal atual. 13 parcelas/ano.</div>'+
    '<div style="overflow-x:auto"><table class="cmp"><thead><tr>'+th+'</tr></thead><tbody>'+tbody+'</tbody></table></div>';
}

// ════════════════════════════════════════════
//  AÇÕES
// ════════════════════════════════════════════
function toggleE(eid,v){ST[eid].ativa=v;render();}

function setMod(eid,idx){
  ST[eid].midx=idx;
  ST[eid].atv=JSON.parse(JSON.stringify(DEF[eid].mods[idx].pad));
  // Pentágono: 15% Gênesis 2 só no Regular (idx=0); Semi: força disc1=0
  ST[eid].disc1=discPadraoD1(eid,idx);
  ST[eid].custom1=false;
  render();
}

function setDisc(eid,n,pct){
  if(n===1){
    // Pentágono Semi: disc1 bloqueado em 0
    if(eid==='pentagono'&&ST[eid].midx>0) return;
    ST[eid].disc1=pct; ST[eid].custom1=false;
  } else {
    ST[eid].disc2=pct; ST[eid].custom2=false;
  }
  render();
}

function setCustom(eid,n){
  if(n===1){ST[eid].custom1=true;}
  else{ST[eid].custom2=true;}
  render();
}

function setDiscVal(eid,n,v){
  if(n===1){
    if(eid==='pentagono'&&ST[eid].midx>0) return;
    ST[eid].disc1=v;
  } else {
    ST[eid].disc2=v;
  }
  render();
}

function setAtv(eid,k,s){
  ST[eid].atv[k].s=s;
  if(s!=='ext')ST[eid].atv[k].c=0;
  else if(!ST[eid].atv[k].c)ST[eid].atv[k].c=DEF[eid].mods[ST[eid].midx].pad[k].c||0;
  render();
}

function setCusto(eid,k,v){ST[eid].atv[k].c=v;render();}

function toggleEQ(k){EQ[k]=!EQ[k];render();}

function T(el,id){
  document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('on');});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});
  document.getElementById('p-'+id).classList.add('on');
  el.classList.add('on');
}

function render(){
  renderEscolas();
  renderDescontos();
  renderAtividades();
  renderResumo();
  renderComparar();
  renderProjecao();
}

render();
</script>
